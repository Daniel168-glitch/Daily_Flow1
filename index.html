<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Flow - จัดการวันของคุณ</title>
    <!-- โหลดฟอนต์ Sarabun และ Playfair Display เหมือนใน React -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Sarabun', sans-serif;
            color: white;
            padding-bottom: 80px;
            position: relative;
            overflow-x: hidden;
        }
        
        .orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
        .container { max-width: 480px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 1; }

        .glass-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        .cat-btn {
            padding: 6px 14px; border-radius: 99px; border: none;
            font-size: 12px; cursor: pointer; font-family: inherit;
            transition: all 0.2s;
        }
        .filter-btn {
            flex: 1; padding: 10px 0; border-radius: 12px; border: none;
            font-size: 13px; cursor: pointer; font-family: inherit;
            transition: all 0.2s;
        }
        .task-item {
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 16px; padding: 14px 16px;
            display: flex; align-items: center; gap: 12px;
            transition: all 0.2s;
        }
        .icon-btn { 
            background: none; border: none; cursor: pointer; padding: 4px; 
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; 
        }
        .icon-btn:hover { transform: scale(1.1); }
        .icon-btn:active { transform: scale(0.9); }
        .logout-btn:hover { background: rgba(255,255,255,0.15) !important; }
    </style>
</head>
<body>

    <!-- พื้นหลังแสงไฟ (Orbs) -->
    <div class="orb" style="width: 300px; height: 300px; top: -80px; right: -60px; background: radial-gradient(circle, #FF6B6B30, transparent);"></div>
    <div class="orb" style="width: 200px; height: 200px; bottom: 100px; left: -50px; background: radial-gradient(circle, #4ECDC430, transparent);"></div>
    <div class="orb" style="width: 150px; height: 150px; top: 40%; right: 10%; background: radial-gradient(circle, #45B7D125, transparent);"></div>

    <div class="container">
        
        <!-- แถบผู้ใช้งาน และปุ่มออกจากระบบ Firebase -->
        <div style="display:flex; justify-content:space-between; align-items:center; padding-top:20px;">
            <div id="userNameDisplay" style="color:rgba(255,255,255,0.6); font-size:13px;">กำลังโหลดข้อมูล...</div>
            <button id="logoutBtn" class="logout-btn" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.8); padding:6px 14px; border-radius:10px; cursor:pointer; font-family:inherit; font-size:12px; transition:0.2s;">ออกจากระบบ</button>
        </div>

        <!-- ส่วนหัว (Header) -->
        <div style="padding-top: 28px; padding-bottom: 28px; text-align: center;">
            <div id="dateDisplay" style="font-size: 13px; color: #ffffff80; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px;"></div>
            <h1 id="greetingDisplay" style="font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; background: linear-gradient(135deg, #fff 30%, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; line-height: 1.2;"></h1>
            <p style="color: #ffffff60; font-size: 14px; margin-top: 6px;">มาจัดการวันนี้กันเถอะ ✨</p>
        </div>

        <!-- แถบความคืบหน้า (Progress) -->
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <span style="color: #ffffffcc; font-size: 14px; font-weight: 600;">ความคืบหน้าวันนี้</span>
                <span id="progressPctText" style="background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px; font-weight: 700;">0%</span>
            </div>
            <div style="height: 8px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden;">
                <div id="progressFill" style="height: 100%; border-radius: 99px; width: 0%; background: linear-gradient(90deg, #a78bfa, #60a5fa); transition: width 0.6s cubic-bezier(.4,0,.2,1);"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                <span id="progressDoneText" style="color: #ffffff50; font-size: 12px;">เสร็จแล้ว 0 รายการ</span>
                <span id="progressTotalText" style="color: #ffffff50; font-size: 12px;">ทั้งหมด 0 รายการ</span>
            </div>
        </div>

        <!-- เพิ่มงานใหม่ (Add Task) -->
        <div class="glass-card" style="padding: 20px;">
            <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                <input id="taskInput" type="text" placeholder="เพิ่มสิ่งที่ต้องทำวันนี้..." style="flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 14px; outline: none; font-family: inherit;">
                <button id="addTaskBtn" style="width: 48px; height: 48px; border-radius: 12px; border: none; background: linear-gradient(135deg, #a78bfa, #60a5fa); color: #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 15px rgba(167,139,250,0.25);">+</button>
            </div>
            <div id="categorySelector" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
        </div>

        <!-- ตัวกรอง (Filters) -->
        <div id="filterContainer" style="display: flex; gap: 8px; margin-bottom: 16px;"></div>

        <!-- รายการงาน (Task List) -->
        <div id="taskList" style="display: flex; flex-direction: column; gap: 10px;"></div>

        <!-- สรุปตามหมวดหมู่ (Summary) -->
        <div id="summaryCard" class="glass-card" style="margin-top: 24px; padding: 16px 20px; display: none;">
            <div style="color: #ffffff60; font-size: 12px; margin-bottom: 12px; letter-spacing: 2px; text-transform: uppercase;">สรุปตามหมวดหมู่</div>
            <div id="summaryList" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

    </div>

    <!-- 1. Script สำหรับจัดการระบบ Login (Firebase) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWMmdYSO26HuTqC2AI2E9hdnmYuIQwueY",
            authDomain: "dailyflowapp.firebaseapp.com",
            projectId: "dailyflowapp",
            storageBucket: "dailyflowapp.firebasestorage.app",
            messagingSenderId: "990095162134",
            appId: "1:990095162134:web:134923b333c3b2ac63ee37"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // เช็คการเข้าสู่ระบบ
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // อย่าลืมแก้ให้ตรงกับชื่อไฟล์ล็อกอินของคุณ (เช่น login.html)
                window.location.href = 'login.html';
            } else {
                document.getElementById('userNameDisplay').innerText = `เข้าสู่ระบบโดย: ${user.email}`;
            }
        });

        // ฟังก์ชันออกจากระบบ
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                sessionStorage.removeItem('userEmail');
                window.location.href = 'login.html';
            });
        });
    </script>

    <!-- 2. Script สำหรับการทำงานของแอป (แปลงจาก React มาเป็น Vanilla JS) -->
    <script>
        const DAYS_TH = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
        const MONTHS_TH = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

        const CATEGORIES = [
            { id: "work", label: "งาน", color: "#FF6B6B", bg: "rgba(255, 107, 107, 0.15)" },
            { id: "personal", label: "ส่วนตัว", color: "#4ECDC4", bg: "rgba(78, 205, 196, 0.15)" },
            { id: "health", label: "สุขภาพ", color: "#45B7D1", bg: "rgba(69, 183, 209, 0.15)" },
            { id: "other", label: "อื่นๆ", color: "#FFA07A", bg: "rgba(255, 160, 122, 0.15)" },
        ];

        // ข้อมูลตัวอย่าง (ข้อมูลตั้งต้น)
        let tasks = [
            { id: 1, text: "ดื่มน้ำให้ครบ 8 แก้ว", cat: "health", done: false, priority: false },
            { id: 2, text: "ประชุมทีม 10:00 น.", cat: "work", done: true, priority: true },
            { id: 3, text: "อ่านหนังสือ 30 นาที", cat: "personal", done: false, priority: false },
        ];
        
        let currentCat = "work";
        let filter = "all";
        let nextId = Date.now();

        // คำนวณวันที่และเวลาปัจจุบัน
        function getToday() {
            const now = new Date();
            return `${DAYS_TH[now.getDay()]}, ${now.getDate()} ${MONTHS_TH[now.getMonth()]} ${now.getFullYear() + 543}`;
        }

        function getGreeting() {
            const h = new Date().getHours();
            if (h < 12) return "อรุณสวัสดิ์ 🌤️";
            if (h < 17) return "สวัสดีตอนบ่าย ☀️";
            return "สวัสดีตอนเย็น 🌙";
        }

        function updateHeader() {
            document.getElementById('dateDisplay').innerText = getToday();
            document.getElementById('greetingDisplay').innerText = getGreeting();
        }

        // จัดการสร้างปุ่มหมวดหมู่
        function renderCategories() {
            const container = document.getElementById('categorySelector');
            container.innerHTML = '';
            CATEGORIES.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.innerText = c.label;
                if (currentCat === c.id) {
                    btn.style.background = c.color;
                    btn.style.color = '#fff';
                    btn.style.fontWeight = '700';
                } else {
                    btn.style.background = 'rgba(255,255,255,0.08)';
                    btn.style.color = '#ffffff80';
                    btn.style.fontWeight = '400';
                }
                btn.onclick = () => { currentCat = c.id; renderCategories(); };
                container.appendChild(btn);
            });
        }

        // จัดการปุ่ม Filter (ทั้งหมด, ยังไม่เสร็จ, เสร็จแล้ว)
        function renderFilters() {
            const container = document.getElementById('filterContainer');
            container.innerHTML = '';
            const filters = [["all", "ทั้งหมด"], ["todo", "ยังไม่เสร็จ"], ["done", "เสร็จแล้ว"]];
            filters.forEach(([k, l]) => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.innerText = l;
                if (filter === k) {
                    btn.style.background = 'rgba(167,139,250,0.25)';
                    btn.style.color = '#a78bfa';
                    btn.style.border = '1px solid rgba(167,139,250,0.5)';
                    btn.style.fontWeight = '700';
                } else {
                    btn.style.background = 'rgba(255,255,255,0.06)';
                    btn.style.color = '#ffffff60';
                    btn.style.border = '1px solid transparent';
                    btn.style.fontWeight = '400';
                }
                btn.onclick = () => { filter = k; renderApp(); };
                container.appendChild(btn);
            });
        }

        // อัปเดตแถบความคืบหน้า
        function renderProgress() {
            const done = tasks.filter(t => t.done).length;
            const pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
            
            document.getElementById('progressPctText').innerText = `${pct}%`;
            document.getElementById('progressFill').style.width = `${pct}%`;
            document.getElementById('progressDoneText').innerText = `เสร็จแล้ว ${done} รายการ`;
            document.getElementById('progressTotalText').innerText = `ทั้งหมด ${tasks.length} รายการ`;
        }

        // ฟังก์ชันแก้ไขข้อมูล
        function toggleDone(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
            renderApp();
        }
        function togglePriority(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, priority: !t.priority } : t);
            renderApp();
        }
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderApp();
        }

        // จัดการวาดรายการ Task List
        function renderTasks() {
            const container = document.getElementById('taskList');
            container.innerHTML = '';
            
            let visible = tasks.filter(t => {
                if (filter === "done") return t.done;
                if (filter === "todo") return !t.done;
                return true;
            }).sort((a, b) => b.priority - a.priority);

            if (visible.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: #ffffff40; font-size: 14px;">
                      <div style="font-size: 40px; margin-bottom: 12px;">🎉</div>
                      ${filter === "done" ? "ยังไม่มีรายการที่เสร็จ" : "ไม่มีรายการเหลืออยู่ เยี่ยมมาก!"}
                    </div>
                `;
                return;
            }

            visible.forEach(task => {
                const c = CATEGORIES.find(cat => cat.id === task.cat);
                const div = document.createElement('div');
                div.className = 'task-item';
                div.style.background = task.done ? "rgba(255,255,255,0.03)" : "rgba(255,255,255,0.07)";
                div.style.border = task.priority ? "1px solid rgba(167,139,250,0.4)" : "1px solid rgba(255,255,255,0.08)";
                div.style.opacity = task.done ? "0.6" : "1";
                div.style.boxShadow = task.priority ? "0 0 20px rgba(167,139,250,0.1)" : "none";

                div.innerHTML = `
                    <button class="icon-btn check-btn" style="width: 26px; height: 26px; border-radius: 8px; background: ${task.done ? 'linear-gradient(135deg, #a78bfa, #60a5fa)' : 'rgba(255,255,255,0.1)'}; color: white; font-size: 14px; flex-shrink: 0;">
                        ${task.done ? '✓' : ''}
                    </button>
                    <div style="flex: 1; min-width: 0;">
                        <div style="color: ${task.done ? '#ffffff40' : '#ffffffee'}; font-size: 14px; text-decoration: ${task.done ? 'line-through' : 'none'}; word-break: break-word;">
                            ${task.text}
                        </div>
                        <div style="margin-top: 4px; display: inline-block; background: ${c.bg}; color: ${c.color}; border-radius: 99px; padding: 2px 10px; font-size: 11px; font-weight: 600;">
                            ${c.label}
                        </div>
                    </div>
                    <button class="icon-btn star-btn" style="font-size: 16px; opacity: ${task.priority ? '1' : '0.3'};" title="สำคัญ">⭐</button>
                    <button class="icon-btn del-btn" style="font-size: 16px; color: #ff6b6b; opacity: 0.5;">✕</button>
                `;

                div.querySelector('.check-btn').onclick = () => toggleDone(task.id);
                div.querySelector('.star-btn').onclick = () => togglePriority(task.id);
                div.querySelector('.del-btn').onclick = () => deleteTask(task.id);

                container.appendChild(div);
            });
        }

        // จัดการส่วนสรุปผลด้านล่าง (Summary)
        function renderSummary() {
            const card = document.getElementById('summaryCard');
            const list = document.getElementById('summaryList');
            
            if (tasks.length === 0) {
                card.style.display = 'none';
                return;
            }
            
            card.style.display = 'block';
            list.innerHTML = '';
            
            CATEGORIES.forEach(c => {
                const total = tasks.filter(t => t.cat === c.id).length;
                const d = tasks.filter(t => t.cat === c.id && t.done).length;
                if (total === 0) return;
                
                const pct = Math.round((d / total) * 100);
                
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.gap = '10px';
                div.innerHTML = `
                    <div style="width: 8px; height: 8px; border-radius: 50%; background: ${c.color}; flex-shrink: 0;"></div>
                    <span style="color: #ffffffaa; font-size: 13px; width: 70px;">${c.label}</span>
                    <div style="flex: 1; height: 4px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden;">
                        <div style="height: 100%; border-radius: 99px; width: ${pct}%; background: ${c.color}; transition: width 0.6s;"></div>
                    </div>
                    <span style="color: #ffffff50; font-size: 12px; flex-shrink: 0;">${d}/${total}</span>
                `;
                list.appendChild(div);
            });
        }

        // อัปเดตทุกส่วนของแอป
        function renderApp() {
            renderFilters();
            renderTasks();
            renderProgress();
            renderSummary();
        }

        // จัดการการเพิ่ม Task ใหม่
        document.getElementById('addTaskBtn').onclick = () => {
            const inputEl = document.getElementById('taskInput');
            const val = inputEl.value.trim();
            if (!val) return;
            
            tasks.push({
                id: ++nextId,
                text: val,
                cat: currentCat,
                done: false,
                priority: false
            });
            
            inputEl.value = '';
            renderApp();
        };

        // กดปุ่ม Enter เพื่อเพิ่มงานได้
        document.getElementById('taskInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('addTaskBtn').click();
        });

        // ---------------------------------
        // เริ่มต้นการทำงาน (Initialize App)
        // ---------------------------------
        updateHeader();
        renderCategories();
        renderApp();
        
        // ให้เช็คและอัปเดตเวลา/คำทักทายทุกๆ 1 นาที
        setInterval(updateHeader, 60000);

    </script>
</body>
</html>
