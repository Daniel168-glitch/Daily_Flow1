<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Daily Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #3a3560 0%, #5a4f8a 100%);
            --glass-bg: rgba(43, 40, 75, 0.95);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-gradient: linear-gradient(135deg, #00E5B2, #009FE5);
            --text-main: #f0f0f5;
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Kanit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-attachment: fixed;
        }

        /* Glow */
        .bg-glow { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
        .glow-1 { position:absolute; top:-10%; left:-10%; width:50vw; height:50vw;
                  background: radial-gradient(circle, rgba(0,229,178,0.12) 0%, transparent 70%); filter:blur(50px); }
        .glow-2 { position:absolute; bottom:-10%; right:-10%; width:60vw; height:60vw;
                  background: radial-gradient(circle, rgba(157,182,255,0.12) 0%, transparent 70%); filter:blur(50px); }

        .login-card {
            position: relative; z-index: 1;
            background: var(--glass-bg);
            border-radius: 30px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
        }

        .logo { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 32px; font-weight: 600; margin-bottom: 10px; }
        .subtitle { color: var(--text-muted); margin-bottom: 40px; font-size: 15px; line-height: 1.6; }

        .login-btn {
            width: 100%; padding: 18px;
            border: none; border-radius: 14px;
            background: var(--accent-gradient);
            color: #000; font-weight: 600; font-size: 16px;
            font-family: 'Kanit'; cursor: pointer;
            transition: all 0.3s; display: flex;
            align-items: center; justify-content: center; gap: 10px;
        }
        .login-btn:hover:not(:disabled) { opacity: 0.9; transform: scale(1.02); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .google-icon { width: 20px; height: 20px; flex-shrink: 0; }

        .note { margin-top: 24px; font-size: 13px; color: var(--text-muted); line-height: 1.6; }
    </style>
</head>
<body>
<div class="bg-glow">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
</div>

<div class="login-card">
    <div class="logo">📋</div>
    <h1>Daily Flow</h1>
    <p class="subtitle">จัดการวันของคุณให้ง่ายขึ้น<br>ทุก Task ทุกวัน ในที่เดียว</p>

    <!-- แก้ไขที่ 1: ลบ onclick="loginWithGoogle()" และระบุ disabled ไว้เป็นค่าเริ่มต้น -->
    <button id="loginBtn" class="login-btn" disabled>
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span id="btnText">กำลังตรวจสอบสถานะ...</span>
    </button>

    <p class="note">ข้อมูลของแต่ละบัญชีจะถูกเก็บแยกกัน<br>และไม่ปะปนกับผู้ใช้คนอื่น</p>
</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } 
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWMmdYSO26HuTqC2AI2E9hdnmYuIQwueY",
            authDomain: "dailyflowapp.firebaseapp.com",
            projectId: "dailyflowapp",
            storageBucket: "dailyflowapp.firebasestorage.app",
            messagingSenderId: "990095162134",
            appId: "1:990095162134:web:134923b333c3b2ac63ee37"
        };

        const app      = initializeApp(firebaseConfig);
        const auth     = getAuth(app);
        const provider = new GoogleAuthProvider();

        const btn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');

        // 1. ตรวจสอบสถานะว่าเคยล็อกอินค้างไว้หรือไม่
        onAuthStateChanged(auth, (user) => {
            if (user) {
                sessionStorage.setItem('userEmail', user.email);
                window.location.href = 'index.html'; // ถ้าล็อกอินแล้วไปหน้าหลักทันที
            } else {
                if (btn && btnText) {
                    btn.disabled = false;
                    btnText.textContent = 'เข้าสู่ระบบด้วย Google';
                }
            }
        });

        // 2. ฟังก์ชันล็อกอิน (เปลี่ยนมาใช้ระบบ Popup แทน Redirect)
        if (btn) {
            btn.addEventListener('click', () => {
                if (btn && btnText) {
                    btn.disabled = true;
                    btnText.textContent = 'กำลังเปิดหน้าต่างล็อกอิน...';
                }
                
                signInWithPopup(auth, provider)
                    .then((result) => {
                        // เมื่อล็อกอินสำเร็จ ให้บันทึกข้อมูลและย้ายหน้า
                        sessionStorage.setItem('userEmail', result.user.email);
                        window.location.href = 'index.html';
                    })
                    .catch((error) => {
                        console.error(error);
                        if (btn && btnText) {
                            btn.disabled = false;
                            btnText.textContent = 'เข้าสู่ระบบด้วย Google';
                        }
                        // ป้องกันการเด้งแจ้งเตือนกรณีที่ผู้ใช้แค่กดปิดหน้าต่าง Popup ไปเอง
                        if (error.code !== 'auth/popup-closed-by-user') {
                            alert('ไม่สามารถล็อกอินได้: ' + error.message);
                        }
                    });
            });
        }
    </script>
